# This workflow is meant to be called remotely from a Skip framework project.
#
# The action will build and test both the Swift and Gradle projects 
# transpiled through Skip.
#
# When tagged with a semantic version (e.g., "1.2.3"), the action will
# create and distribute release .aar and .jar artifacts from the project.
#
# An example invocation script is as follows, which runs for 
# every push, every PR, every semver tag, and every day at noon GMT:
#
# name: skiplib
# on:
#   push:
#     branches: '*'
#     tags: "[0-9]+.[0-9]+.[0-9]+"
#   schedule:
#     - cron: '0 12 * * *'
#   workflow_dispatch:
#   pull_request:
# 
# permissions:
#   contents: write
# 
# jobs:
#   call-workflow:
#     uses: skiptools/actions/.github/workflows/skip-framework.yml@v1
# 
name: "Skip Framework CI"
on:
  workflow_call:
    inputs:
      # Need an Intel macOS runner to be able to run the Android emulator
      # https://github.com/ReactiveCircus/android-emulator-runner/issues/350
      runs-on:
        required: false
        type: string
        default: "['macos-15-intel']"
      brew-install:
        required: false
        type: string
      skip-source:
        required: false
        type: string
      install-swift:
        required: false
        type: string
      run-export:
        required: false
        type: boolean
        default: true
      run-local-tests:
        required: false
        type: boolean
        default: true
      run-ios-tests:
        required: false
        type: boolean
        default: true
      run-android-tests:
        required: false
        type: boolean
        default: true
      android-native-disabled:
        required: false
        type: boolean
        default: false
      run-android-native-build:
        required: false
        type: string
      swift-android-sdk-version:
        required: false
        type: string
        default: "['']"
      emulator-api-level:
        required: false
        type: string
        default: '28'
      emulator-channel:
        required: false
        type: string
        default: 'stable'
      emulator-profile:
        required: false
        type: string
        default: 'Nexus 4'
        #default: 'medium_phone'
      emulator-target:
        required: false
        type: string
        default: 'default'
      emulator-launcher:
        required: false
        type: string
        default: 'reactivecircus'
        # alternative: use skip android emulator create/launch
        # https://github.com/skiptools/skip/pull/574
        #default: 'skip'
      env:
        description: |
          Newline-separated list of KEY=VALUE environment variables to export
          for every step in the job. Pass via a YAML block scalar:

              env: |
                SKIP_MODE=fuse
                VERBOSE=1

          Useful for framework projects whose Package.swift switches dependencies
          on an env var. The value is treated as plain text, so shell
          metacharacters are not interpreted.
        required: false
        type: string
        default: ''

jobs:
  skip-framework:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.runs-on) }}
        android-sdk: ${{ fromJson(inputs.swift-android-sdk-version) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    #env:     
      #DEVELOPER_DIR: /Applications/Xcode_26.1.app/Contents/Developer
      #DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # Parse the `env` workflow input (one KEY=VALUE pair per line) and
      # append each entry to $GITHUB_ENV so that it is exported for every
      # subsequent step in this job, as well as for any child processes
      # (gradle, swift, skip, …) those steps spawn.
      #
      # The input is passed through an environment variable (not interpolated
      # into the script source) so that special characters in the value do not
      # turn into shell injection.
      - name: "Configure workflow environment"
        if: ${{ inputs.env != '' }}
        env:
          SKIP_WORKFLOW_ENV_INPUT: ${{ inputs.env }}
        run: |
          set -euo pipefail
          # Walk each line of the input; YAML block scalars and folded scalars
          # both deliver newline-separated content here.
          while IFS= read -r entry || [ -n "${entry}" ]; do
            # Trim leading/trailing whitespace; skip empty lines and comments.
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -z "${entry}" ] && continue
            [[ "${entry}" == \#* ]] && continue
            if [[ "${entry}" != *=* ]]; then
              echo "::warning::Skipping malformed env entry (expected KEY=VALUE): ${entry}"
              continue
            fi
            key="${entry%%=*}"
            value="${entry#*=}"
            # Only allow conventional identifier characters in the key so this
            # cannot be coerced into writing arbitrary GITHUB_ENV directives.
            if [[ ! "${key}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::warning::Skipping env entry with invalid key '${key}'"
              continue
            fi
            echo "Setting workflow env: ${key}"
            echo "${key}=${value}" >> "${GITHUB_ENV}"
          done <<< "${SKIP_WORKFLOW_ENV_INPUT}"

      - name: Verify License Headers
        if: ${{ startsWith(github.event.repository.name, 'skip-') && github.repository_owner == 'skiptools' }}
        run: |
          FAILED=0
          FAILED_FILES=()
          # Match both normal hyphen (-) and en-dash (–) between year ranges
          YEAR_PATTERN='^// Copyright [0-9]{4}([-–][0-9]{4})? Skip$'
          while IFS= read -r file; do
            LINE1=$(sed -n '1p' "$file")
            LINE2=$(sed -n '2p' "$file")
            if ! echo "$LINE1" | grep -qE "$YEAR_PATTERN"; then
              echo "::error file=$file,line=1::Expected first line to match '// Copyright YYYY-YYYY Skip' but found: $LINE1"
              FAILED=1
              FAILED_FILES+=("$file")
            fi
            if [ "$LINE2" != "// SPDX-License-Identifier: MPL-2.0" ]; then
              echo "::error file=$file,line=2::Expected second line to be '// SPDX-License-Identifier: MPL-2.0' but found: $LINE2"
              FAILED=1
              FAILED_FILES+=("$file")
            fi
          done < <(find . -name '*.swift' -not -path './.build/*' -not -name 'Package.swift')
          # Verify LICENSE.txt exists and is MPL-2.0
          LICENSE_YEAR_PATTERN='^Copyright [0-9]{4}([-–][0-9]{4})? Skip$'
          if [ ! -f LICENSE.txt ]; then
            echo "::error::LICENSE.txt not found in the repository root."
            FAILED=1
          else
            LICENSE_LINE1=$(sed -n '1p' LICENSE.txt)
            if ! echo "$LICENSE_LINE1" | grep -qE "$LICENSE_YEAR_PATTERN"; then
              echo "::error file=LICENSE.txt,line=1::Expected first line to match 'Copyright YEAR-YEAR Skip' but found: $LICENSE_LINE1"
              FAILED=1
            fi
            if ! grep -q 'Mozilla Public License' LICENSE.txt; then
              echo "::error file=LICENSE.txt::LICENSE.txt does not appear to contain the Mozilla Public License."
              FAILED=1
            fi
            if ! grep -q 'Version 2\.0' LICENSE.txt; then
              echo "::error file=LICENSE.txt::LICENSE.txt does not appear to be MPL Version 2.0."
              FAILED=1
            fi
            if ! grep -q 'mozilla.org/MPL/2\.0' LICENSE.txt; then
              echo "::error file=LICENSE.txt::LICENSE.txt does not contain the MPL-2.0 reference URL (mozilla.org/MPL/2.0)."
              FAILED=1
            fi
          fi

          if [ "$FAILED" -ne 0 ]; then
            # Deduplicate the list of offending files
            UNIQUE_FILES=($(printf '%s\n' "${FAILED_FILES[@]}" | sort -u))
            echo "::error::License check failed for ${#UNIQUE_FILES[@]} file(s): ${UNIQUE_FILES[*]}"
            echo "Every .swift file must start with '// Copyright YYYY-YYYY Skip' on line 1 and '// SPDX-License-Identifier: MPL-2.0' on line 2. LICENSE.txt must exist, start with 'Copyright YEAR-YEAR Skip', and contain the Mozilla Public License 2.0."
            exit 1
          fi

      - name: Setup Environment
        id: setup
        run: |
          # convert "refs/tags/1.0.0" to "1.0.0"
          # and "refs/heads/main" to "main"
          TAG=${GITHUB_REF#refs/*/}
          # the version if it matches the semantic tag pattern, otherwise "dev"
          echo "RELTAG=${TAG:-'dev'}" >> $GITHUB_ENV
          # the emulator we use should match the host architecture
          echo "android-arch=$(uname -m | sed 's/arm64/arm64-v8a/')" >> $GITHUB_OUTPUT
          if [[ ${{ inputs.android-native-disabled }} != true ]]; then
            # check whether we use skip-bridge and so need the Android toolchain
            SKIP_BRIDGE=1 swift package resolve
            test -d Sources/SkipBridge || jq -e '.pins | any(.identity == "skip-bridge")' Package.resolved >> /dev/null && echo "skip-fuse=true" >> $GITHUB_OUTPUT || echo "Swift Android toolchain not required"
          fi

          if [[ "${{ inputs.run-android-native-build }}" == "true" ]]; then
            echo "skip-fuse=true" >> $GITHUB_OUTPUT
          fi

          # Default on Ubuntu 24.04 is JAVA_HOME_17_X64
          # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#java
          # but we need Java 21 or else:
          # classMethod java.lang.UnsupportedOperationException: Failed to create a Robolectric sandbox: Android SDK 36 requires Java 21 (have Java 17)
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> $GITHUB_ENV

      - uses: skiptools/actions/setup-skip@v1
        with:
          verify-project: '.'
          skip-source: '${{ inputs.skip-source }}'
          install-swift-android-sdk: ${{ steps.setup.outputs.skip-fuse }}
          swift-android-sdk-version: ${{ matrix.android-sdk }}

      - name: Install Prerequisities
        if: ${{ inputs.brew-install != '' }}
        run: brew install ${{ inputs.brew-install }}

      - name: Get swift version
        run: swift --version

      - name: Swift Android Toolchain Build
        if: ${{ inputs.run-android-native-build == 'true' || (steps.setup.outputs.skip-fuse == 'true' && inputs.run-android-native-build != 'false') }}
        run: skip android build --verbose

      - name: Test Local Swift & Robolectric
        if: ${{ inputs.run-local-tests == true && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          rm -rf .build .swiftpm Package.resolved
          swift test

          # disabling skip test for now because it doesn't execute XCTestCase
          #if [ ${RUNNER_OS} == 'Linux' ]; then
            # skip test does not yet work on Linux ("SkipDrive not linked")
            #swift test
          #else
            #skip test --verbose
          #fi

      - name: Export project
        if: ${{ inputs.run-export == true }}
        run: |
          rm -rf .build .swiftpm Package.resolved
          skip export -v -d skip-export --show-tree --summary-file=$GITHUB_STEP_SUMMARY

      - name: Test iOS (connected)
        if: ${{ runner.os == 'macOS' && inputs.run-ios-tests == true && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # list the current devices that are available
          xcrun simctl list devices available

          # choose a pre-installed simulator based on the macos runner
          if [[ "${{ matrix.os }}" == "macos-13"* ]]; then
            SIMDEVICE="iPhone 15"
          elif [[ "${{ matrix.os }}" == "macos-14"* ]]; then
            SIMDEVICE="iPhone 16"
          elif [[ "${{ matrix.os }}" == "macos-15"* ]]; then
            SIMDEVICE="iPhone 17"
          elif [[ "${{ matrix.os }}" == "macos-26"* ]]; then
            SIMDEVICE="iPhone 17"
          else
            # e.g., "macos-latest" or self-hosted/custom runner
            SIMDEVICE="iPhone 17"
          fi

          # run the tests against the first listed scheme, which for a
          # single-module package will just be "project-name",
          # and for a multi-module package will be "project-name-Package"
          # We also need to reverse sort so we will get "project-name-Package"
          # before some other module that might come earlier (like "Auth")
          SKIP_TEST_MODULE=$(xcodebuild -list -json | jq -r '.workspace.schemes | sort_by(.) | reverse | .[0]')
          echo "Testing Skip module: ${SKIP_TEST_MODULE} from schemes list: $(xcodebuild -list -json | jq -r '.workspace.schemes[]')"
          SKIP_ZERO=1 xcodebuild test -sdk iphonesimulator -destination "platform=iOS Simulator,name=${SIMDEVICE}" -skipMacroValidation -skipPackagePluginValidation -configuration debug -scheme ${SKIP_TEST_MODULE}

      - name: Prepare Android Emulator
        if: ${{ inputs.run-android-tests == true && env.RUNNER_ARCH != 'ARM64' }}
        run: |
          if [ "${RUNNER_OS}" == 'Linux' ]; then
            # set up hardware acceleration for emulator
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm

            # need to free disk space or the emulator fails to launch sometimes
            sudo rm -rf /opt/microsoft /opt/google /opt/az /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/julia* /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          fi

      - name: Create and Launch skip android emulator
        if: ${{ inputs.emulator-launcher == 'skip' && inputs.run-android-tests == true && env.RUNNER_ARCH != 'ARM64' }}
        run: |
          export ANDROID_USER_HOME=$HOME/.android
          export ANDROID_EMULATOR_HOME=$ANDROID_USER_HOME
          export ANDROID_AVD_HOME=$ANDROID_EMULATOR_HOME/avd

          skip android emulator create --android-api-level="${{ inputs.emulator-api-level }}" --device-profile="${{ inputs.emulator-profile }}" --verbose
          skip android emulator list --verbose
          skip android emulator launch --background --verbose

      - name: Test Android on skip android emulator (connected)
        # Android emulator needs to be disabled for macOS ARM machines
        # due to lack of nested virtualization on the M1 runner machines
        # (https://github.com/ReactiveCircus/android-emulator-runner/issues/350)
        if: ${{ inputs.emulator-launcher != 'skip' && inputs.emulator-launcher == 'skip' && inputs.run-android-tests == true && env.RUNNER_ARCH != 'ARM64' }}
        run: |
          adb logcat *:E TestRunner:V & ANDROID_SERIAL=emulator-5554 swift test --filter XCSkipTests

      - name: Cache ReactiveCircus Android emulator snapshot
        if: ${{ inputs.emulator-launcher != 'skip' && inputs.run-android-tests == true && !startsWith(github.ref, 'refs/tags/') && env.RUNNER_ARCH != 'ARM64' }}
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: 'avd-${{ inputs.emulator-profile }}_${{ inputs.emulator-channel }}_${{ inputs.emulator-target }}_${{ inputs.emulator-api-level }}_${{ matrix.os }}_${{ steps.setup.outputs.android-arch }}'

      # cache the emulator snapshot to speed up the launch, as per
      # https://github.com/ReactiveCircus/android-emulator-runner
      # note that the actual run must happen with -no-snapshot-save
      # in order to not invalidate the cache
      - name: Generate ReactiveCircus Android emulator snapshot
        if: ${{ inputs.emulator-launcher != 'skip' && inputs.run-android-tests == true && !startsWith(github.ref, 'refs/tags/') && steps.avd-cache.outputs.cache-hit != 'true' && env.RUNNER_ARCH != 'ARM64' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: ${{ inputs.emulator-target }}
          api-level: ${{ inputs.emulator-api-level }}
          arch: ${{ steps.setup.outputs.android-arch }}
          channel: ${{ inputs.emulator-channel }}
          profile: ${{ inputs.emulator-profile }}
          avd-name: '${{ inputs.emulator-channel }}_${{ inputs.emulator-target }}_${{ inputs.emulator-api-level }}'
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching"

      - name: Test ReactiveCircus Android emulator (connected)
        # Android emulator needs to be disabled for macos-14 and 15
        # due to lack of nested virtualization on the M1 runner machines
        # (https://github.com/ReactiveCircus/android-emulator-runner/issues/350)
        if: ${{ inputs.emulator-launcher != 'skip' && inputs.run-android-tests == true && !startsWith(github.ref, 'refs/tags/') && env.RUNNER_ARCH != 'ARM64' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: ${{ inputs.emulator-target }}
          api-level: ${{ inputs.emulator-api-level }}
          arch: ${{ steps.setup.outputs.android-arch }}
          channel: ${{ inputs.emulator-channel }}
          profile: ${{ inputs.emulator-profile }}
          avd-name: '${{ inputs.emulator-channel }}_${{ inputs.emulator-target }}_${{ inputs.emulator-api-level }}'
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: adb logcat *:E TestRunner:V & swift test --filter XCSkipTests

      - name: "Release"
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d "skip-export" ]; then
            gh release create "${RELTAG}" -t "Release ${RELTAG}" --generate-notes skip-export/*.*
          else
            gh release create "${RELTAG}" -t "Release ${RELTAG}" --generate-notes
          fi

