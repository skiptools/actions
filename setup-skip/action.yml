name: 'Setup Skip'
description: 'Installs and configures the Skip development environment'
branding:
  icon: 'box'
  color: 'blue'

inputs:
  skip-source:
    description: 'The Homebrew source to install skip from (formula or cask or branch name); "formula" automatically installs the cask instead on Intel macOS runners'
    required: false
    default: 'formula'
  run-doctor:
    description: 'Whether to run skip doctor'
    required: false
    default: 'true'
  verify-project:
    description: 'Path to the project to verify'
    required: false
    default: ''
  swift-version:
    description: 'Version of Swift to install'
    required: false
    default: ''
  gradle-version:
    description: 'Version of Gradle to setup'
    required: false
    default: 'current'
  install-swift-android-sdk:
    description: 'Whether to install the native Swift SDK for Android'
    required: false
    default: 'false'
  swift-android-sdk-version:
    description: 'Version of the Swift SDK for Android to install'
    required: false
    default: ''
  swift-android-ndk-version:
    description: 'Version of the Android SDK to install with the Swift SDK for  Android'
    required: false
    default: ''
  swift-snapshot:
    description: |
      Full name of a swift.org development snapshot to use instead of a released
      toolchain, e.g. "swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-09-04-a". When set, both the
      host toolchain and the Swift SDK for Android are downloaded from download.swift.org
      rather than from swiftly and the skiptools Homebrew cask, neither of which carries
      preview branches. Requires `swift-snapshot-branch`.
    required: false
    default: ''
  swift-snapshot-branch:
    description: |
      The download.swift.org branch directory holding `swift-snapshot`,
      e.g. "swift-6.4.x-branch". Only used when `swift-snapshot` is set.
    required: false
    default: ''
  verbose:
    description: 'Whether to be verbose when running setup commands'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Install Homebrew
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@main

    - name: Install Gradle
      if: ${{ inputs.gradle-version != '' && inputs.gradle-version != 'none' }}
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: ${{ inputs.gradle-version }}
        add-job-summary: 'on-failure'

    - name: Install Skip
      shell: bash
      run: |
        # whether to install the canonical "skip" formula
        # or the skiptools cask tap version of the tool
        #export HOMEBREW_NO_AUTO_UPDATE=1
        skip_source="${{ inputs.skip-source }}"
        if [[ "${skip_source}" == "" ]]; then
          skip_source="formula"
        fi

        # homebrew-core builds the skip formula only for arm64 macOS and Linux, so on an
        # Intel macOS runner like macos-15-intel `brew install skip` has no bottle and falls
        # back to an Xcode source build that is impractical on CI. The cask installs the same
        # universal release artifact and its dependencies are bottled for Intel, so use it.
        runner_arch="${RUNNER_ARCH:-$(uname -m)}"
        if [[ "${skip_source}" == "formula" && "${RUNNER_OS}" == "macOS" ]] && [[ "${runner_arch}" == "X64" || "${runner_arch}" == "x86_64" ]]; then
          echo "::notice::Installing the skip cask rather than the homebrew-core formula, which has no Intel macOS bottle"
          skip_source="cask"
        fi

        if [[ "${skip_source}" == "formula" ]]; then
          brew install skip
        elif [[ "${skip_source}" == "cask" ]]; then
          brew tap skiptools/skip
          brew install skiptools/skip/skip
        else
          # otherwise checkout and build the branch name in skip-source
          cd ${TMPDIR}
          git clone --recurse-submodules --branch "${skip_source}" https://github.com/skiptools/skipstone.git
          swift build --package-path skipstone/
          mv skipstone/.build/debug/SkipRunner skipstone/.build/debug/skip
          SKIPPATH="${PWD}/skipstone/.build/debug"
          echo "${SKIPPATH}" >> $GITHUB_PATH
          echo "SKIP_COMMAND_OVERRIDE=${SKIPPATH}/skip" >> $GITHUB_ENV
          cd -
          ${SKIPPATH}/skip version

          # also need swiftly, which otherwise comes in from brew dependency
          brew install swiftly
        fi

        if [ ${RUNNER_OS} == 'macOS' ]; then
          # enable running the Skip plugin from xcodebuild without user prompt
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
        fi

    - name: Setup environment
      id: setup
      shell: bash
      run: |
        verbose_arg=""
        if [[ "${{ inputs.verbose }}" ]]; then
          verbose_arg="--verbose"
        fi
        echo "verbose_arg=${verbose_arg}" >> $GITHUB_OUTPUT

    - name: Install Toolchain Dependencies
      shell: bash
      run: |
        if [ ${RUNNER_OS} == 'Linux' ]; then
          # needed to be able to install swiftly toolchains
          sudo apt-get -y install libcurl4-openssl-dev || (sudo apt-get update && sudo apt-get -y install libcurl4-openssl-dev)
        fi

    - name: Initialize swiftly
      shell: bash
      run: swiftly init --skip-install --assume-yes

    - name: Install Host Swift Toolchain
      if: ${{ inputs.swift-version != '' && inputs.swift-snapshot == '' }}
      shell: bash
      run: |
        # TODO: Error: invalid toolchain selector: "nightly-6.3"
        swiftly install ${{ inputs.swift-version }}

    # Preview toolchains (e.g. the 6.4.x branch) are not resolvable by swiftly and have no
    # skiptools Homebrew cask, so the host toolchain and the matching Swift SDK for Android are
    # fetched straight from swift.org. The two must be the same snapshot: the SDK's modules are
    # only loadable by the compiler that produced them.
    - name: Install Swift snapshot toolchain and Swift SDK for Android
      if: ${{ inputs.swift-snapshot != '' }}
      shell: bash
      env:
        SNAPSHOT: ${{ inputs.swift-snapshot }}
        BRANCH: ${{ inputs.swift-snapshot-branch }}
        INSTALL_ANDROID_SDK: ${{ inputs.install-swift-android-sdk }}
      run: |
        set -euo pipefail

        if [ -z "${BRANCH}" ]; then
          echo "::error::swift-snapshot-branch is required when swift-snapshot is set"
          exit 1
        fi

        if [ "${RUNNER_OS}" != "macOS" ]; then
          echo "::error::swift-snapshot installation is currently implemented for macOS runners only"
          exit 1
        fi

        # Installs into ~/Library/Developer/Toolchains, which is where `skip android build` looks
        # for the toolchain matching the Swift SDK for Android. Xcode's own toolchain cannot
        # cross-compile for Android: it ships no swift-autolink-extract, so linking fails with
        # "env: swift-autolink-extract: No such file or directory".
        curl -fsSL --retry 5 -o "${RUNNER_TEMP}/swift-toolchain.pkg" \
          "https://download.swift.org/${BRANCH}/xcode/${SNAPSHOT}/${SNAPSHOT}-osx.pkg"
        installer -pkg "${RUNNER_TEMP}/swift-toolchain.pkg" -target CurrentUserHomeDirectory

        SNAPSHOT_SWIFT="${HOME}/Library/Developer/Toolchains/${SNAPSHOT}.xctoolchain/usr/bin/swift"
        if [ ! -x "${SNAPSHOT_SWIFT}" ]; then
          echo "::error::Snapshot toolchain was not installed at ${SNAPSHOT_SWIFT}"
          ls "${HOME}/Library/Developer/Toolchains/" || true
          exit 1
        fi
        "${SNAPSHOT_SWIFT}" --version

        if [ "${INSTALL_ANDROID_SDK}" == "true" ]; then
          # the NDK that the SDK's sysroot is linked against
          brew install --cask android-ndk

          curl -fsSL --retry 5 -o "${RUNNER_TEMP}/swift-android-sdk.tar.gz" \
            "https://download.swift.org/${BRANCH}/android-sdk/${SNAPSHOT}/${SNAPSHOT}_android.artifactbundle.tar.gz"

          # Install with the snapshot's own swift: the runner's Xcode may ship an older SwiftPM
          # that does not understand the bundle's swift-sdk.json schema. The destination
          # (~/Library/org.swift.swiftpm/swift-sdks) is the same either way.
          "${SNAPSHOT_SWIFT}" sdk install "${RUNNER_TEMP}/swift-android-sdk.tar.gz"

          # Unlike the Homebrew cask (whose postflight does this), the downloaded bundle ships
          # without an `ndk-sysroot`; its own script links one against the installed NDK.
          SDK_DIR="${HOME}/Library/org.swift.swiftpm/swift-sdks/${SNAPSHOT}_android.artifactbundle/swift-android"
          ANDROID_NDK_HOME="$(brew --prefix)/share/android-ndk" "${SDK_DIR}/scripts/setup-android-sdk.sh"

          "${SNAPSHOT_SWIFT}" sdk list

          # workaround fail when ANDROID_NDK_ROOT is set
          # see https://github.com/finagolfin/swift-android-sdk/issues/207
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV
        fi

    - name: Install Swift SDK for Android
      if: ${{ inputs.install-swift-android-sdk == 'true' && inputs.swift-snapshot == '' }}
      shell: bash
      run: |
        sdk_version_arg=""
        if [[ ! -z "${{ inputs.swift-android-sdk-version }}" ]]; then
          sdk_version_arg="--version ${{ inputs.swift-android-sdk-version }}"
        fi
        ndk_version_arg=""
        if [[ ! -z "${{ inputs.swift-android-ndk-version }}" ]]; then
          ndk_version_arg="--ndk-version ${{ inputs.swift-android-ndk-version }}"
        fi

        skip android sdk install ${{ steps.setup.outputs.verbose_arg }} ${sdk_version_arg} ${ndk_version_arg}

        # workaround fail when ANDROID_NDK_ROOT is set
        # see https://github.com/finagolfin/swift-android-sdk/issues/207
        echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV

    - name: Skip Doctor
      if: ${{ inputs.run-doctor == 'true' }}
      shell: bash
      run: skip doctor ${{ steps.setup.outputs.verbose_arg }}

    - name: Skip Verify Project
      if: ${{ inputs.verify-project != '' }}
      shell: bash
      run: skip verify ${{ steps.setup.outputs.verbose_arg }} --project ${{ inputs.verify-project }}

